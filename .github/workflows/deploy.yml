name: Deploy Frontend to GitHub Pages

# Executa o script toda vez que houver um push na branch main
on:
  push:
    branches: ["main"]
  workflow_dispatch: # Permite rodar manualmente no GitHub

# Permissões estritas necessárias para o Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dois deploys rodem ao mesmo tempo e deem conflito

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact (Aponta para a sua pasta frontend)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
